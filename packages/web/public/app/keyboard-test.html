<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app's own viewport line, so this page differs from the app only by having none of its code. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Keyboard test</title>
    <style>
      body { margin: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 16px; font: 16px -apple-system, system-ui, sans-serif; background: #131518; color: #e8e8e6; }
      input, textarea { display: block; width: 100%; box-sizing: border-box; margin: 6px 0 18px; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #555; background: #1c1e22; color: inherit; }
      .fixed { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: #22252a; transform: translateY(0px); }
      a { color: #76a8ff; }
      p { margin: 0 0 6px; font-size: 14px; color: #aaa; }
    </style>
  </head>
  <body>
    <p>No app code runs on this page. Tap each field: does the keyboard come up?</p>
    <label>1. Plain text input<input type="text" autocomplete="off" /></label>
    <label>2. Plain textarea<textarea rows="2"></textarea></label>
    <p><a href="/">Back to the app</a></p>
    <div class="fixed">
      <label>3. Textarea in a fixed, transformed bar (like the app's composer)<textarea rows="1"></textarea></label>
    </div>
  </body>
</html>
